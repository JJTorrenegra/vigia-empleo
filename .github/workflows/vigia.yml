name: Vigía de empleo público

on:
  schedule:
    # Horas en UTC. 07:20 UTC = 08:20 en invierno / 09:20 en verano (Madrid).
    # Una segunda pasada por la tarde por si algún boletín se retrasa.
    - cron: "20 7 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write   # guardar resultados y la página
  issues: write     # abrir los avisos

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Revisar boletines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python vigia.py

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name  "vigia-bot"
          git config user.email "vigia-bot@users.noreply.github.com"
          git add datos docs
          git diff --cached --quiet || git commit -m "Actualización $(date -u +%F)"
          git push
