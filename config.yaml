# =====================================================================
#  VIGÍA DE EMPLEO PÚBLICO — configuración
#  Puedes editar este archivo directamente en GitHub (icono del lápiz).
#  Las líneas que empiezan por # son comentarios y no hacen nada.
#  Mayúsculas y tildes dan igual. El plural se reconoce solo
#  («bolsa de trabajo» también encuentra «bolsas de trabajo»).
# =====================================================================

# Cuántos días se muestran en la página de resultados.
dias: 30

# Un anuncio aparece si cumple LAS TRES condiciones:
#   1) es una VÍA DE ENTRADA al empleo   (lista «tipos_de_convocatoria»)
#   2) encaja con tu PERFIL              (lista «perfiles»)
#   3) es de tu ZONA                     (municipios u organismos de interés)
# y su título NO contiene nada de «excluir_si_el_titulo_contiene».

# --- 1) Vía de entrada (normalmente se busca en el TÍTULO del anuncio) ---
tipos_de_convocatoria:
  - convocatoria
  - convoca
  - convocan
  - proceso selectivo
  - procedimiento selectivo
  - pruebas selectivas
  - selección
  - bolsa
  - lista de espera
  - oposición
  - concurso-oposición
  - oferta de empleo
  - empleo público
  - plaza
  - puesto
  - contratación temporal
  - contratación laboral
  - personal laboral temporal
  - interino
  - interina
  - interinidad
  - estabilización
  - proceso extraordinario
  - urgente
  - urgencia
  - programa mixto
  - empleo-formación

# --- 2) Tu perfil (se busca en el TEXTO COMPLETO del anuncio) ---
perfiles:
  # Administrativo. «administrativo/a» suelto solo cuenta cuando es un puesto
  # («plaza de Administrativo», «Auxiliar Administrativo», «Administrativo/a»),
  # no como adjetivo legal («procedimiento administrativo»).
  - administrativo
  - administrativa
  - auxiliar administrativo
  - gestión administrativa
  - cuerpo de gestión
  - escala de gestión
  - subescala de gestión
  - técnico de gestión
  - técnica de gestión
  - gestor de proyectos
  - gestora de proyectos
  - técnico de apoyo
  - técnica de apoyo
  - apoyo a la gestión
  - apoyo a la investigación
  - gestión de la investigación
  # Universidades y Educación
  - personal de administración y servicios
  - PAS
  - PTGAS
  - personal técnico, de gestión y de administración y servicios
  # Proyectos y programas temporales
  - personal de proyectos
  - con cargo a proyectos
  - proyectos europeos
  - programas europeos
  - programas de carácter temporal
  - ejecución de programas
  - programa mixto de empleo
  - empleo-formación
  # Formador
  - formador
  - formadora
  - experto docente
  - expertos docentes
  - docencia de la formación profesional para el empleo
  - formación profesional para el empleo
  - formación para el empleo
  - certificado de profesionalidad
  - ofimática
  - atención al cliente
  - inteligencia artificial
  - software de gestión
  - ADGG   # certificados de la familia Administración y gestión
  - ADGD
  - IFCT   # certificados de Informática y comunicaciones

# Si el TÍTULO contiene algo de esto, se descarta (no son vías de entrada).
excluir_si_el_titulo_contiene:
  - subvención
  - ayuda
  - premio
  - licitación
  - adjudicación
  - formalización
  - concurso de traslado
  - admitidos y excluidos
  - admitidas y excluidas
  - composición del tribunal

# Pon «false» para que «administrativo» cuente siempre, también como adjetivo.
exigir_contexto_de_puesto: true

# --- 3) Tu zona ---
municipios:
  - Torrevieja
  - San Pedro del Pinatar
  - Almoradí
  - San Javier
  - Los Alcázares
  - Murcia
  - Cartagena
  - Torre-Pacheco
  - La Unión
  - San Miguel de Salinas
  - Los Montesinos
  - Guardamar del Segura
  - Rojales
  - Formentera del Segura
  - Benijófar
  - Algorfa
  - Rafal
  - Benejúzar
  - Bigastro
  - Jacarilla
  - Orihuela
  - Daya Vieja
  - Daya Nueva
  - San Fulgencio
  - Dolores
  - Catral
  - Beniel
  - Santomera
  - Alcantarilla

# Organismos que también cuentan como «tu zona» aunque no sean un ayuntamiento
# (se buscan en el título y en el organismo que publica).
organismos_extra:
  - Universidad de Murcia
  - Universidad Politécnica de Cartagena
  - Universidad Miguel Hernández
  - Universidad de Alicante
  - Región de Murcia
  - Servicio Murciano de Salud
  - Servicio Regional de Empleo y Formación

# ---------------------------------------------------------------------
# Fuentes.
#  municipio_en: dónde se busca la zona
#    titulo    -> «Ayuntamiento de X» u organismo de interés en el título
#    organismo -> el organismo que publica es uno de tus municipios
#    texto     -> en cualquier parte del texto (más resultados, más ruido)
#    ninguno   -> no se exige zona
#  exigir_tipo: false -> no hace falta la condición 1 (la fuente ya es de empleo)
#  tipo_en: titulo (rápido, recomendado) o texto
#  Para desactivar una fuente, pon «activa: false».
# ---------------------------------------------------------------------
fuentes:
  - nombre: "BOE · Oposiciones"
    tipo: boe_rss
    url: "https://www.boe.es/rss/canal_per.php?l=p&c=140"
    municipio_en: titulo
    exigir_tipo: false
    activa: true

  - nombre: "BOE · Concursos de personal"
    tipo: boe_rss
    url: "https://www.boe.es/rss/canal_per.php?l=p&c=141"
    municipio_en: titulo
    exigir_tipo: false
    activa: true

  - nombre: "BOE · III. Otras disposiciones"
    tipo: boe_rss
    url: "https://www.boe.es/rss/boe.php?s=3"
    municipio_en: texto
    activa: true

  - nombre: "BOE · V.B. Otros anuncios oficiales"
    tipo: boe_rss
    url: "https://www.boe.es/rss/boe.php?s=5B"
    municipio_en: texto
    activa: true

  - nombre: "BORM"
    tipo: borm_rss
    # boletin.xml trae TODO el boletín del día (incluidas «I2. Autoridades y
    # Personal» e «I3. Otras Disposiciones»). Los canales por organismo traen
    # los últimos 30 días de ese organismo, también sus anuncios de I2 e I3.
    urls:
      - "https://www.borm.es/rss/boletin.xml"     # BORM del día (todas las secciones)
      - "https://www.borm.es/rss/cg.xml"          # Consejo de Gobierno
      - "https://www.borm.es/rss/org31.xml"       # Asamblea Regional
      - "https://www.borm.es/rss/org375.xml"      # Consejería de Fomento e Infraestructuras
      - "https://www.borm.es/rss/org369.xml"      # Consejería de Salud
      - "https://www.borm.es/rss/ent10407.xml"    # Servicio Murciano de Salud
      - "https://www.borm.es/rss/org29.xml"       # Presidencia
      - "https://www.borm.es/rss/org178.xml"      # Ayuntamiento de Alcantarilla
      - "https://www.borm.es/rss/org189.xml"      # Ayuntamiento de Cartagena
      - "https://www.borm.es/rss/org196.xml"      # Ayuntamiento de La Unión
      - "https://www.borm.es/rss/org200.xml"      # Ayuntamiento de Los Alcázares
      - "https://www.borm.es/rss/org172.xml"      # Ayuntamiento de Murcia
      - "https://www.borm.es/rss/org209.xml"      # Ayuntamiento de San Javier
      - "https://www.borm.es/rss/org210.xml"      # Ayuntamiento de San Pedro del Pinatar
      - "https://www.borm.es/rss/org211.xml"      # Ayuntamiento de Santomera
      - "https://www.borm.es/rss/org212.xml"      # Ayuntamiento de Torre-Pacheco
      - "https://www.borm.es/rss/org28.xml"       # Particulares
    activa: true
    secciones:
      comunidad_autonoma:      # Sección I: I1 Disposiciones, I2 Autoridades y Personal,
        activa: true           #            I3 Otras Disposiciones, I4 Anuncios
        municipio_en: ninguno  # todo lo de la Comunidad Autónoma cuenta
        # solo_apartados: ["I2", "I3"]   # <- quita el # para leer solo esos apartados
      administracion_local:    # Sección IV, solo tus ayuntamientos
        activa: true
        municipio_en: organismo
      particulares:            # Sección V / anuncios de particulares
        activa: true
        municipio_en: texto
        tipo_en: texto         # sus títulos son genéricos: el tipo se busca en el texto

# ---------------------------------------------------------------------
# Portal de Empleo Público de la CARM (empleopublico.carm.es).
# Cada búsqueda es la dirección que sale al buscar en el portal.
# El vigía muestra en la web lo que hay ahora mismo en cada búsqueda y te
# avisa por correo cuando aparece una convocatoria que no había visto antes.
# Para añadir otro cuerpo, copia una búsqueda y cambia el código que va
# detrás de CUERPOS_OFERTABLES= (ejemplos: BGX00 Gestión Administrativa A2,
# CFX25 Tributaria C1, DFX31 Tributaria C2, CFX16 Informática C1).
# Estados (ESTADOS_OPOSICIONES=): IN plazo de solicitud abierto,
# AC oposiciones actuales, HI oposiciones antiguas.
# ---------------------------------------------------------------------
portal_carm:
  activo: true
  busquedas:
    - nombre: "Administrativo, C1 · plazo abierto"
      url: "https://empleopublico.carm.es/web/pagina?IDCONTENIDO=62006&IDTIPO=100&RASTRO=c%24m61986%2C61991&BUSCAR_POR=CUERPO_OFERTA&CUERPOS_OFERTABLES=CGX00&ESTADOS_OPOSICIONES=IN&Buscar=Buscar"
    - nombre: "Auxiliares Administrativos, C2 · plazo abierto"
      url: "https://empleopublico.carm.es/web/pagina?IDCONTENIDO=62006&IDTIPO=100&RASTRO=c%24m61986%2C61991&BUSCAR_POR=CUERPO_OFERTA&CUERPOS_OFERTABLES=DGX00&ESTADOS_OPOSICIONES=IN&Buscar=Buscar"
    - nombre: "Biblioteca, Técnicos Auxiliares, C2 · plazo abierto"
      url: "https://empleopublico.carm.es/web/pagina?IDCONTENIDO=62006&IDTIPO=100&RASTRO=c%24m61986%2C61991&BUSCAR_POR=CUERPO_OFERTA&CUERPOS_OFERTABLES=DFX38&ESTADOS_OPOSICIONES=IN&Buscar=Buscar"
    - nombre: "Biblioteca, Técnicos Especialistas, C1 · plazo abierto"
      url: "https://empleopublico.carm.es/web/pagina?IDCONTENIDO=62006&IDTIPO=100&RASTRO=c%24m61986%2C61991&BUSCAR_POR=CUERPO_OFERTA&CUERPOS_OFERTABLES=CFX22&ESTADOS_OPOSICIONES=IN&Buscar=Buscar"

# Relleno de días anteriores con la API de datos abiertos del BOE.
# 2B = Oposiciones y concursos (equivale a los canales 140 y 141).
relleno_boe:
  activo: true
  secciones: ["2B"]
  municipio_en: titulo
  exigir_tipo: false

# Avisos: abre un «issue» en el repositorio por cada novedad y GitHub te lo
# envía por correo. Si hay más de «agrupar_si_mas_de» novedades a la vez,
# las junta en un solo issue.
avisos:
  issues: true
  agrupar_si_mas_de: 8
